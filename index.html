\" ry=\"9\" fill=\"#A9B391\" stroke=\"#171B20\" stroke-width=\"3\"/><ellipse cx=\"116\" cy=\"76\" rx=\"5\" ry=\"9\" fill=\"#A9B391\" stroke=\"#171B20\" stroke-width=\"3\"/><path d=\"M49 62q-3-42 33-43 35 2 34 42l-12-10-8 6-12-13-12 15-11-4z\" fill=\"#252521\" stroke=\"#171B20\" stroke-width=\"4\"/><circle cx=\"69\" cy=\"72\" r=\"5\" fill=\"#171B20\"/><circle cx=\"99\" cy=\"72\" r=\"5\" fill=\"#171B20\"/><path d=\"M67 92h34v12H67z\" fill=\"#ECE7DC\"/><path d=\"M76 92v12m12-12v12\" stroke=\"#67372F\" stroke-width=\"2\"/></svg>"};
const scenes={"start":{"stage":1,"name":"La alarma inicial","place":"AULA PRINCIPAL · 08:17 PM","say":"«¿Qué fue ese ruido? Todos atrás. Lucía, ¿estás bien?»","text":"La alarma corta la clase. Desde el patio llegan golpes y gritos. Mateo intenta hablar con calma, pero le tiembla la voz.","opts":[["A","Atrancar la puerta con los bancos","La puerta resiste. Diego ayuda a empujar y el grupo gana unos segundos.","hall",{"health":8,"morale":-5}],["B","Correr al buffet por provisiones","Mateo sale primero. Sofía lo sigue; al volver traen comida, pero el pasillo ya no parece seguro.","hall",{"resources":1,"health":-10}],["C","Mirar por la ventana y buscar una salida","Lucía ve movimiento en el patio. El grupo descubre una ruta lateral antes de que la puerta ceda.","yard",{"morale":8}]]},"hall":{"stage":2,"name":"Pasillos y transición","place":"PASILLO NORTE · LUCES DE EMERGENCIA","say":"«No nos separemos. Si escuchan algo, avisen.»","text":"La luz roja parpadea sobre los casilleros. Un golpe resuena desde la escalera. Mateo deja de gritar y empieza a organizar al grupo.","opts":[["A","Avanzar en silencio por la galería","El grupo cruza sin llamar la atención. Sofía asiente: Mateo empieza a marcar el ritmo.","cafeteria",{"morale":8}],["B","Usar el extintor para abrirse paso","El estruendo distrae a los infectados, pero Mateo recibe un golpe al proteger a Tomás.","loading",{"resources":1,"health":-15}],["C","Revisar el aula de preceptoría","Encuentran vendas y una linterna. Diego propone seguir juntos.","office",{"resources":1,"morale":3}]]},"yard":{"stage":2,"name":"Patio bajo la lluvia","place":"PATIO INTERNO · LLUVIA","say":"«Por la galería. Sin correr: todavía no sabemos cuántos hay.»","text":"El patio está vacío por un instante. Al otro lado, una puerta de servicio quedó entreabierta.","opts":[["A","Cruzar corriendo hasta el buffet","Llegan antes de que aparezca la horda. Lucía se lastima al caer.","cafeteria",{"health":-8,"resources":1}],["B","Bordear por la galería techada","El grupo se mantiene unido y evita exponerse.","cafeteria",{"morale":10}],["C","Entrar por la puerta de servicios","Mateo encuentra herramientas y una caja de alimentos.","loading",{"resources":2,"health":-5}]]},"cafeteria":{"stage":3,"name":"Comedor principal","place":"COMEDOR · VIDRIOS ROTOS","say":"«Primero contamos qué tenemos. Después decidimos.»","text":"Las mesas están volcadas. El grupo encuentra una radio que transmite fragmentos de una evacuación.","opts":[["A","Reunir raciones y agua","Sofía reparte las provisiones. Por primera vez, Mateo escucha una broma de Diego.","lab",{"resources":2,"morale":8}],["B","Buscar las llaves en preceptoría","Mateo registra cajones mientras los demás vigilan. Encuentra las llaves del colegio.","lab",{"keys":true,"resources":1,"health":-8}],["C","Atravesar el salón sin detenerse","Evitan el ruido, pero dejan atrás suministros útiles.","gym",{"health":-5,"morale":5}]]},"loading":{"stage":3,"name":"Ala de carga","place":"ALA DE CARGA · DEPÓSITO","say":"«Encontré un botiquín. Lucía, ayudame con esto.»","text":"Cajones volcados bloquean media salida. Una puerta metálica golpea desde el otro lado.","opts":[["A","Asegurar el botiquín y vendajes","Mateo atiende a Tomás. El grupo recupera algo de confianza.","lab",{"resources":2,"morale":10}],["B","Buscar llaves en la oficina","La búsqueda toma tiempo y atrae golpes hacia la puerta. Mateo consigue las llaves.","lab",{"keys":true,"resources":1,"health":-12}],["C","Barricar la entrada y descansar","Los demás descansan mientras Mateo sostiene la puerta. Sus brazos tiemblan al terminar.","gym",{"health":12,"morale":-8}]]},"office":{"stage":3,"name":"Preceptoría interna","place":"PRECEPTORÍA · ARCHIVADORES","say":"«Hay una salida. No prometo que sea fácil, pero vamos juntos.»","text":"Entre los archivadores hay una radio portátil y un mapa de evacuación marcado a mano.","opts":[["A","Llevar el mapa y seguir la ruta techada","El plano los guía hacia el laboratorio sin cruzar el patio.","lab",{"resources":1,"morale":8}],["B","Revisar el escritorio por llaves","Encuentran las llaves de la camioneta y una linterna casi sin batería.","lab",{"keys":true,"resources":1,"health":-5}],["C","Salir por la escalera cercana","Un infectado aparece al final del pasillo. Mateo cubre la retirada del grupo.","gym",{"health":-12,"morale":5}]]},"lab":{"stage":4,"name":"Laboratorio y área técnica","place":"LABORATORIO · LUZ AZUL","say":"«La radio dice estación. Si el generador funciona, podremos pedir ayuda.»","text":"El mensaje se repite entre interferencias: “Punto de evacuación en la estación”. El gimnasio conecta con el estacionamiento.","opts":[["A","Reparar la radio con las herramientas","Diego y Mateo estabilizan la señal. La voz confirma que la evacuación sigue activa.","gym",{"resources":-1,"morale":12}],["B","Buscar insumos médicos","Lucía encuentra medicamentos y los guarda para el grupo.","gym",{"resources":1,"morale":5}],["C","Abandonar a Tomás para avanzar","Tomás queda atrás. Nadie mira a Mateo cuando dice que no había otra opción.","gym",{"health":8,"morale":-22}]]},"gym":{"stage":5,"name":"Gimnasio","place":"GIMNASIO · ECO EN LAS GRADAS","say":"«Escuchen. Uno por vez. Salimos juntos y nadie queda atrás.»","text":"Un ruido corre por las gradas. Mateo, ahora firme, da instrucciones. La puerta al estacionamiento está cerrada.","opts":[["A","Abrirla con herramientas","La bisagra cede con un estruendo. El grupo pasa antes de que la horda llegue.","parking",{"health":-8,"resources":-1}],["B","Usar la llave de la camioneta","La llave también abre la salida lateral. Llegan al vehículo sin alertar a los infectados.","parking",{"keysRequired":true,"morale":8}],["C","Empujar todos juntos","La puerta se abre a fuerza de hombros. Mateo queda exhausto, pero nadie se separa.","parking",{"health":-12,"morale":12}]]},"parking":{"stage":6,"name":"Estacionamiento","place":"ESTACIONAMIENTO · AMANECER ROJO","say":"«Es ahora o nunca. Esta vez sé lo que tenemos que hacer.»","text":"La camioneta espera junto al portón. A lo lejos, una sirena responde a la radio. Mateo reconoce su propia voz: ya no suena asustada.","opts":[["A","Subir todos y conducir a la estación","El grupo se organiza alrededor de Mateo. La radio marca el camino entre calles bloqueadas.","endA",{"keysRequired":true}],["B","Refugiarse en el gimnasio hasta el rescate","Sin llaves, deciden asegurar el gimnasio y sostener la señal de radio.","endB",{}],["C","Abrir el portón y distraer a la horda","Mateo se queda para dar tiempo a los demás. La última frase la dice con calma.","endC",{}]]}};const ends={"endA":{"stage":6,"name":"Final: La estación","place":"ESTACIÓN · PRIMERA LUZ","say":"«Estamos juntos. Seguimos.»","text":"La camioneta atraviesa el portón. En la estación, otros sobrevivientes los reciben. Mateo mira al grupo: nadie quedó atrás.","ending":true},"endB":{"stage":6,"name":"Final: Señal de vida","place":"GIMNASIO · AMANECER","say":"«La señal sigue activa. Aguantamos un poco más.»","text":"El grupo bloquea las entradas y mantiene la radio encendida. El rescate llega al amanecer. No fue una huida, pero sobrevivieron juntos.","ending":true},"endC":{"stage":6,"name":"Final: El último eco","place":"PORTÓN · SILUETAS","say":"«Vayan. Yo los alcanzo.»","text":"La horda se dirige hacia Mateo mientras sus compañeros cruzan el portón. Su voz, antes llena de dudas, se pierde entre las sirenas.","ending":true}};
let state;function restart(){state={node:'start',health:70,morale:55,resources:1,keys:false,log:[]};render()}function clamp(n,min,max){return Math.max(min,Math.min(max,n))}function current(){return scenes[state.node]||ends[state.node]}function render(){const n=current();const bid=n.place.includes('PASILLO')?'fondo-pasillo':n.place.includes('LABORATORIO')?'fondo-laboratorio':n.place.includes('GIMNASIO')?'fondo-gimnasio':n.place.includes('ESTACIONAMIENTO')||n.place.includes('ESTACIÓN')||n.place.includes('PORTÓN')?'fondo-estacionamiento':n.stage>=3?'fondo-buffet':'fondo-aula';document.getElementById('sceneArt').innerHTML=ART[bid];document.getElementById('cast').innerHTML=`<div class="actor mateo">${CAST.mateo}</div>`+(n.stage>=3?`<div class="actor lucia">${CAST.lucia}</div><div class="actor diego">${CAST.diego}</div><div class="actor sofia">${CAST.sofia}</div>`:'');document.getElementById('stage').textContent=`CAPÍTULO ${n.stage} / 6 · ${n.name.toUpperCase()}`;document.getElementById('sceneTitle').textContent=n.place;document.getElementById('speech').textContent=n.say;document.getElementById('hud').innerHTML=`<div class="meter"><b>SALUD · ${state.health}%</b><div class="track"><div class="fill health" style="width:${state.health}%"></div></div></div><div class="meter"><b>MORAL · ${state.morale}</b><div class="track"><div class="fill morale" style="width:${state.morale}%"></div></div></div><div class="meter"><b>RECURSOS</b><span class="res">${'■ '.repeat(state.resources)||'—'}</span></div><div class="meter"><b>LLAVES</b><span class="res">${state.keys?'● SÍ':'○ NO'}</span></div>`;const emo=state.morale<30?'Mateo evita mirar al grupo y responde con miedo.':state.morale<70?'Mateo respira hondo antes de hablar; el grupo espera su decisión.':'Mateo mantiene la voz firme y los demás siguen sus indicaciones.';document.getElementById('status').textContent=`${emo}\n\n${state.health<40?'Está agotado; cada movimiento le cuesta.':state.health>75?'Se mantiene en pie y puede proteger a los demás.':'Tiene golpes y sigue avanzando.'}\n\n${state.keys?'Las llaves de la camioneta están en el bolsillo de Mateo.':'Todavía no tienen las llaves de la camioneta.'}\n\n${state.log.slice(-2).join('\n')}`;let story=`<h2>${n.name}</h2><div class="copy">${n.text}</div>`;if(n.ending){story+=`<div class="choices"><button class="choice" onclick="restart()">JUGAR DE NUEVO</button></div>`}else{story+='<div class="choices">'+n.opts.map(([letter,label,effect,next,change])=>{const locked=change?.keysRequired&&!state.keys;return `<button class="choice" ${locked?'disabled':''} onclick="choose('${letter}')"><strong>${letter}.</strong> ${label}${locked?'<br><span class="locked">🔒 Se necesitan las llaves</span>':''}</button>`}).join('')+'</div>'}document.getElementById('story').innerHTML=story}
function choose(letter){const n=current(),opt=n.opts.find(o=>o[0]===letter);if(!opt)return;const [l,label,effect,next,change={}]=opt;if(change.keysRequired&&!state.keys)return;let msg=effect;if(change.health)state.health=clamp(state.health+change.health,0,100);if(change.morale)state.morale=clamp(state.morale+change.morale,0,100);if(change.resources)state.resources=clamp(state.resources+change.resources,0,5);if(change.keys)state.keys=true;if(state.health<=0){state.node='endC';msg='Mateo cae exhausto y el grupo debe escapar sin él.'}else state.node=next;state.log.push(`• ${msg}`);if(state.log.length>4)state.log.shift();const s=document.getElementById('scene');s.classList.remove('flash');void s.offsetWidth;s.classList.add('flash');render();window.scrollTo(0,0)}restart();
</script></body></html>
